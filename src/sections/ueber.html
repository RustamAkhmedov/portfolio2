<section id="ueber" data-part="P-03" aria-labelledby="ueber-title">
  <h2 id="ueber-title">{{sections.ueber}}</h2>
  <img class="portrait" src="{{@root}}img/portrait.webp" alt="{{about.photoAlt}}" width="400" height="400" loading="lazy" decoding="async">
  <h3>{{about.title}}</h3>
  <p>{{{about.text1}}}</p>
  <p>{{{about.text2}}}</p>
  <h3>{{info.title}}</h3>
  <dl class="info">
    <div><dt>{{info.location.k}}</dt><dd>{{info.location.v}}</dd></div>
    <div><dt>{{info.status.k}}</dt><dd>{{info.status.v}}</dd></div>
    <div><dt>{{info.focus.k}}</dt><dd>{{info.focus.v}}</dd></div>
    <div><dt>{{info.school.k}}</dt><dd>{{info.school.v}}</dd></div>
    <div><dt>{{info.languages.k}}</dt><dd>{{info.languages.v}}</dd></div>
  </dl>
</section>
